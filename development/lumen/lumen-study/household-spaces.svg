<title id="title">WITHDRAWN / INCOMPLETE HOUSEHOLD SKETCH</title>
<desc id="desc">WITHDRAWN AS A LAYOUT BASE: this sketch omits essential story spaces. See Lumen-Space-Inventory.md. A local horizontal relationship sketch shows a connected dwelling with shared household rooms, a continuous internal hall and adjacent private rooms for Kael, Calista and Lyra. A semi-private household garden adjoins the home. A local shared path runs outside its boundary, connecting nearby households to shared woodland and the treehouse, and onward to wider community spaces. Room geometry and boundary positions are proposals, not a measured plan or a floor plan of the vessel.</desc>
