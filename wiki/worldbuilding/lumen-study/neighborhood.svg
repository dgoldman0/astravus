<title id="title">WITHDRAWN / INCOMPLETE NEIGHBORHOOD SKETCH</title><desc id="desc">WITHDRAWN AS A LAYOUT BASE: this sketch omits essential story spaces. See Lumen-Space-Inventory.md. An unscaled section distinguishes a connected household interior and its semi-private garden from a local shared wooded treehouse edge, court and paths. Other connected interiors recur above and below, with workshops, lifts and a higher overlook. The home symbol shows only its shared room; adjoining private rooms continue beyond the cut. This is not the canonical location of the dome.</desc>
