<text x="54" y="954" class="heading">WHAT THIS SECTION SHOULD PROVE IN THE NEXT BLENDER STUDY</text>
<text x="54" y="996" class="label">One connected home opens to its household garden, then local shared paths, woodland and courts at several inhabited heights.</text>
<text x="54" y="1028" class="label">The shared room is part of a dwelling; other rooms continue beyond the cut. Amber areas mark interiors, not separate houses.</text>
<text x="54" y="1060" class="label">The oak and treehouse occupy the broader shared wooded edge. The Tree of Echoes remains a different tree and place.</text>
<text x="54" y="1107" class="small">The overlook tests the VN’s depth; this drawing does not place the story’s dome beside Calista’s home.</text>
</svg>
